<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon_b.png" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('pilliox-theme') || 'system';
          var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (d) document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = d ? '#111113' : '#f1f1f1';
        } catch(e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#111113" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pilliox" />
    <link rel="apple-touch-icon" href="/logo-big.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo-big.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logo-big.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/logo-big.png" />

    <title>Pilliox - Medication, blood test values, and medical notes tracker</title>
    <meta name="description" content="Track your medication, supplements, and medical values with Pilliox - Your personal health calendar app" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
